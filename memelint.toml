#:schema https://raw.githubusercontent.com/antimemes/memelint/main/crates/memelint/memelint.schema.json
# The `strict` profile applies to all files. Start the check with `memelint check`.
# The descriptions of a campaign have their own configuration: campaigns/<name>/memelint.toml.
profile = "strict"
check = false
words = [
  "GitHub", "memelint", "nixpkgs", "patchix", "pnpm", "direnv", "nix", "Nix", "NixOS", "Nix store", "flake", "schema", "schemas", "git", "gh",
  "tab", "tabs", "shallow clone", "clone", "fetch", "subcommand", "subcommands", "Base UI", "Storybook", "story", "stories", "editor", "remark", "remarks",
  "base", "tip", "adopt", "adopts", "update", "updates",
  "cacert", "fix", "fixes", "fixed", "description", "descriptions", "title", "titles", "state", "states", 
  "review notes", "extra words", "technical name", "technical names", "curated", "remote", "remotes", "web page", "page",
  "disclosure", "vendored", "words", "web", "review", "reviews", "tick box", "tick boxes", "AI policy",
  "ask", "asks", "question", "questions", "reply", "replies", "zellij", "session", "sessions", "ground truth", "video", "tour", "discloses",
  "settings",
]

[scopes.docs]
