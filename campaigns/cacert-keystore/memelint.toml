#:schema https://raw.githubusercontent.com/antimemes/memelint/main/crates/memelint/memelint.schema.json
# The memelint configuration of the pull request descriptions of the `cacert-keystore` campaign. patchix starts
# `memelint check --config campaigns/cacert-keystore/memelint.toml <file>` on each description.
# memelint does not examine code blocks, HTML blocks (<details>, <!-- -->), inline code or URLs.
#
# The list below is the curated list of technical names. An agent gives more names in `words.txt` of its
# run; a person moves the good names here.
check = true
profile = "strict"
words = [
  # names of tools, formats and specifications
  "nix-cacert-harness", "memelint", "nixpkgs", "patchix", "Nix", "Nix store", "NixOS",
  "Claude Code", "Claude Fable", "Claude Opus",
  "Simplified Technical English",
  "GitHub", "Linux", "darwin", "Windows", "Python", "Java", "Ruby", "libcurl", "curl", "glibc",
  "AI disclosure", "pull request description", "pull request",

  # TLS and certificates
  "certificate", "root", "chain", "trust store", "fingerprint", "intermediate certificate",
  "Sectigo", "Mozilla", "CA store", "keystore", "JRE", "JDK", "Java keystore",

  # packages
  "wheel", "gem", "shim", "sandbox", "derivation", "interpreter", "overlay", "dynamic loader", "merge conflict",
  "label", "supersede", "supersedes", "operating system", "modification time", "fix", "small fix", "Rust",

  # units
  "minute", "hour", "year",

  # The constant text of the pull request template of nixpkgs. Do not use it in the paragraphs.
  # memelint accepts an expression of more than one word only when all its words are together.
  "Things done", "automation/AI policy", "Built on platform", "Basic functionality",
  "Ran on this", "nixpkgs-review usage", "core functionality", "release notes",
  "Package update", "major or breaking", "Module addition", "when adding",
  "Module update", "change is significant",
]
