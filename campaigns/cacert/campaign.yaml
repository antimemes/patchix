# The campaign for NixOS/nixpkgs#576541: packages that ship their own CA PEM bundle.
name: cacert
title: Vendored CA PEM bundles
issue:
  repo: NixOS/nixpkgs
  number: 576541
base_branch: master
branch_prefix: cacert/
labels:
  - "1.severity: security"
timeout_minutes: 90
checks:
  # nix-cacert-harness examines the trust stores of the package before and after the fix, and tests the
  # package with the certificate chains of the eMudhra incident. It is started in the worktree, thus
  # "after" is the worktree.
  - name: harness
    command: nix run github:irgolic/nix-cacert-harness -- {attr} --base {base} --emudhra
    pass: "^VERDICT {attr} emudhra: FIXED"
    reviewer: nix run github:irgolic/nix-cacert-harness -- {attr} --pr {pr} --emudhra
    # These are the flags of nix-cacert-harness that a person can add to the check mark of a description.
    flags:
      - name: --force-build
      - name: --shim
        value: true
      - name: --no-system-store
    timeout_minutes: 90
