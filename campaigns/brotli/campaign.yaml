# The campaign for NixOS/nixpkgs#578375: packages that bundle or link statically their own copy of the brotli
# C decoder (CVE-2026-111497). The issue has a different line format: `tasks.ts` reads it.
name: brotli
title: Vendored Brotli decoders
issue:
  repo: NixOS/nixpkgs
  number: 578375
base_branch: master
branch_prefix: brotli/
labels:
  - "1.severity: security"
timeout_minutes: 120
checks:
  # `brotli-check` (check.nix and check.sh) builds the package of the worktree ("after") and of the base ("before"),
  # and examines each output with the standalone scanner of trailofbits/brotli-checker at a fixed commit. FIXED: the
  # scanner finds a bad copy before and no bad copy after; check.sh tells the copies. MARKED INSECURE:
  # `meta.knownVulnerabilities` has the CVE. NOT FIXED and UNKNOWN do not agree with `pass`: a person examines the
  # output. patchix gets `brotli-check` from its `PATH`. The `reviewer` command gets it from the flake of patchix, and
  # its "after" is the pull request.
  - name: scanner
    command: brotli-check {attr} --base {base}
    pass: "^VERDICT {attr}: (FIXED|MARKED INSECURE)$"
    reviewer: nix run github:antimemes/patchix#brotli-check -- {attr} --pr {pr}
    timeout_minutes: 120
