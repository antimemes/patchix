# The campaign for NixOS/nixpkgs#578375: packages that bundle or link statically their own copy of the brotli
# C decoder (CVE-2026-111497). The issue has a different line format: `tasks.ts` reads it.
name: brotli
title: Vendored Brotli decoders
issue:
  repo: NixOS/nixpkgs
  number: 578375
base_branch: master
branch_prefix: brotli/
labels:
  - "1.severity: security"
timeout_minutes: 120
checks:
  # check.sh builds the package of the worktree ("after") and of the base ("before"), and examines each output with
  # the standalone scanner of trailofbits/brotli-checker at a fixed commit. FIXED: the scanner finds a bad copy
  # before and no bad copy after; check.sh tells the copies. MARKED INSECURE: `meta.knownVulnerabilities` has the
  # CVE. NOT FIXED and UNKNOWN do not agree with `pass`: a person examines the output.
  - name: scanner
    command: sh '{root}/campaigns/brotli/check.sh' {attr} {base}
    pass: "^VERDICT {attr}: (FIXED|MARKED INSECURE)$"
    reviewer: |-
      out=$(nix-build --no-out-link -A {attr} https://github.com/NixOS/nixpkgs/archive/pull/{pr}/head.tar.gz)
      curl -sL https://github.com/trailofbits/brotli-checker/archive/7a585c00589471351b6625a46574c7173720ada0.tar.gz | tar -xz && nix-shell -p python3 --run "python3 brotli-checker-7a585c00589471351b6625a46574c7173720ada0/skills/brotli-checker/scripts/brotli_inventory.py $(echo $out)"
    timeout_minutes: 120
